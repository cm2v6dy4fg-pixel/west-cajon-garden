name: Garden build

on:
  schedule:
    - cron: "0 13 * * *"   # daily 13:00 UTC (6 AM Pacific in summer, 5 AM in winter), keeps the storm-watch forecast fresh
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pull station data and build the page + calendar feed
        run: python3 build_garden.py
      # Committing the data snapshot keeps the repo active, so GitHub doesn't pause the schedule after 60 days.
      - name: Save station data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/station.json
          git diff --cached --quiet || git commit -m "Station data $(date -u +%F)"
          git pull --rebase -X theirs && git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
